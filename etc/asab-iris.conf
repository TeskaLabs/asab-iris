[library]
providers=./library

[smtp]
# Configure the SMTP server to be used for outgoing emails
host=smtp.example.com
user=admin
password=password
from=info@example.com
ssl=no
starttls=yes
subject=Mail from ASAB Iris

# DEV-ONLY: skip TLS cert verification. Connection is encrypted but NOT trusted; vulnerable to MITM.
validate_certs=false 

# Path to CA bundle (PEM) used when validate_certs=true.
# Needed for self-signed/internal CAs (put your CA/chain here).
# Leave empty to use system trust store.
# Ignored if validate_certs=false.
cert_bundle=

# Optional HTTP CONNECT proxy host for SMTP transport
proxy_host=
# Optional HTTP CONNECT proxy port
proxy_port=

# Optional proxy username (basic auth)
proxy_user=    
# Optional proxy password (basic auth)        
proxy_password=

# Optional proxy connect timeout (in seconds)
proxy_connect_timeout=10


[slack]
# Configure the integration with Slack
token=xoxb-111111111111-2222222222222-3333333333333
channel=general

[mattermost]
# Configure the integration with Mattermost
url=https://teams.example.com
token=your_mattermost_bot_token
bot_username=your_mattermost_bot_username
security_channel_id=your_default_channel_id

[msteams]
# Configure the integration with Microsoft Teams
webhook_url=https://yourcompany.webhook.office.com/webhookb2/xxxxxx-xxxx-xxx-xxx-xxxx@xxxxx-xxxx-xxx-xxx-xxxx/IncomingWebhook/xxxxx/xxx-xxx-xxx-xxx-xxxxx

[sms]
login=your_smsbrana_login
password=your_smsbrana_password
timestamp_format=%Y%m%dT%H%M%S
api_url=https://api.smsbrana.cz/smsconnect/http.php

[notification_retry]
# Maximum attempts per provider operation, including the first attempt.
max_attempts=3
# Retry delays and total elapsed budget, in seconds.
initial_delay=1
max_delay=10
max_elapsed=180
